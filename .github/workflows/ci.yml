name: SwiftAgent CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  SWIFT_AGENT_REQUIRED_SWIFT: "6.4"

jobs:
  macos:
    name: macOS Swift 6.4
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runner metadata
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          swift --version
      - name: Select Swift 6.4 Xcode
        run: bash Scripts/select-apple-toolchain.sh
      - name: Verify compiler, Xcode, and SDK
        run: bash Scripts/require-toolchain.sh --apple
      - name: Build, test, iOS cross-build, external client
        run: bash Scripts/ci-macos.sh
      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reporting-macos-attempt-${{ github.run_attempt }}
          path: |
            .build/ci-logs/
            .build/execution-reporting-acceptance.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Core concurrency seal
        run: bash Scripts/ci-concurrency-seal.sh

  linux:
    name: Linux Swift 6.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runner metadata
        run: |
          cat /etc/os-release
          uname -a
      - name: Install Swift 6.4
        run: bash Scripts/install-linux-swift.sh
      - name: Verify compiler
        run: bash Scripts/require-toolchain.sh
      - name: Core --target build, tests, external client
        run: bash Scripts/ci-linux.sh
      - name: Upload acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-reporting-linux-attempt-${{ github.run_attempt }}
          path: |
            .build/ci-logs/
            .build/execution-reporting-acceptance.json
          if-no-files-found: ignore
          retention-days: 30

  apple-provider:
    name: Apple provider compile
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Runner metadata
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          swift --version
      - name: Select Swift 6.4 Xcode
        run: bash Scripts/select-apple-toolchain.sh
      - name: Verify compiler, Xcode, and SDK
        run: bash Scripts/require-toolchain.sh --apple
      - name: Apple adapter fixtures
        run: bash Scripts/ci-apple-provider.sh
